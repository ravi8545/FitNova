info:
  name: Logout
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/api/auth/logout/"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  body:
    type: json
    data: |-
      {
          "refresh": "{{refresh_token}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
