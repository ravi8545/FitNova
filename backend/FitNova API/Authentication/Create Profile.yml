info:
  name: Create Profile
  type: http
  seq: 11

http:
  method: POST
  url: "{{base_url}}/api/profile/create/"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "date_of_birth": "1999-11-21",
          "gender": "male",
          "height": 178,
          "current_weight": 80,
          "target_weight": 75,
          "fitness_goal": "weight_loss",
          "activity_level": "moderate"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
