info:
  name: Change Password
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}/api/auth/change-password/"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  body:
    type: json
    data: |-
      {
          "old_password": "Raj@12345",
          "new_password": "Raj@123456",
          "confirm_password": "Raj@123456"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
