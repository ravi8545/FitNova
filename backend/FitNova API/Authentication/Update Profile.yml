info:
  name: Update Profile
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{base_url}}/api/auth/me/"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  body:
    type: json
    data: |-
      {
          "first_name": "Rajendra",
          "last_name": "Pawar",
          "phone": "9999999999"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
