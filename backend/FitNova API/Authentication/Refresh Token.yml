info:
  name: Refresh Token
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/api/auth/token/refresh/"
  body:
    type: json
    data: |-
      {
          "refresh": "{{refresh_token}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
